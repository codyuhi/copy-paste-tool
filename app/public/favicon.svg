<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Background icon card -->
  <rect x="5" y="5" width="16" height="20" rx="4" fill="url(#bg-glow)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" filter="url(#shadow)" />
  <rect x="5" y="5" width="16" height="20" rx="4" fill="none" stroke="url(#primary-glow)" stroke-width="1" opacity="0.4" />
  
  <!-- Foreground icon card -->
  <rect x="11" y="9" width="16" height="20" rx="4" fill="#0b0f19" stroke="url(#primary-glow)" stroke-width="2" filter="url(#shadow)" />
  
  <!-- Clipboard clip top -->
  <path d="M16 9h6a1 1 0 0 1 1 1v1a1 1 0 0 1-1 1h-6a1 1 0 0 1-1-1v-1a1 1 0 0 1 1-1z" fill="url(#primary-glow)" />

  <!-- Text lines on the foreground card representing copy/paste lines -->
  <line x1="15" y1="15" x2="23" y2="15" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  <line x1="15" y1="19" x2="23" y2="19" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="15" y1="23" x2="19" y2="23" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" />
</svg>