<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Borderless Cedar glyph; adapts to the browser chrome via prefers-color-scheme.
       Clipboard with an ochre clip and two lines of copied text. -->
  <style>
    .board { stroke: #1f513f; }
    .ink { fill: #1f513f; }
    .clip { fill: #b8860b; }
    @media (prefers-color-scheme: dark) {
      .board { stroke: #f4f2ed; }
      .ink { fill: #f4f2ed; }
      .clip { fill: #d89f28; }
    }
  </style>
  <rect class="board" x="11" y="11" width="42" height="49" rx="6" stroke-width="5"/>
  <rect class="clip" x="21" y="4" width="22" height="13" rx="4"/>
  <rect class="ink" x="20" y="29" width="24" height="5" rx="2.5"/>
  <rect class="ink" x="20" y="41" width="16" height="5" rx="2.5"/>
</svg>
