<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ebe7df" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="author" content="Cody Uhi" />
    <meta name="description" content="A modern, secure copy-paste utility dashboard for customer support and chat call center agents." />
    <!-- SVG favicon only: it adapts to the browser chrome via prefers-color-scheme -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Chat Agent Tool</title>
    <!-- Apply the saved (or OS) theme before first paint to prevent a theme flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cpt_theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#161614' : '#ebe7df';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
