name: CI / Security & Build Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  security-and-lint:
    name: Secret Scan & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Validate YAML & JSON Syntax
        run: |
          python3 -c '
          import json, glob, sys
          for f in glob.glob("**/*.json", recursive=True):
              if "node_modules" not in f and ".git" not in f:
                  try:
                      json.load(open(f))
                  except Exception as e:
                      print(f"Invalid JSON {f}: {e}")
                      sys.exit(1)
          print("JSON syntax validation passed!")
          '

      - name: Validate Dockerfile Syntax
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "Dockerfile"
          ignore: DL3008,DL3018,DL3013
        continue-on-error: true

  backend-test:
    name: Go Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run Go Tests
        run: |
          cd backend
          go test -v ./...
          go build ./cmd/server

  frontend-test:
    name: React Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd app
          npm ci

      - name: Run Tests & Build
        run: |
          cd app
          npm test
          npm run build
